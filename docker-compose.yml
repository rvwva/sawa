version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sawa_db
      POSTGRES_USER: sawa
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawa -d sawa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://sawa:changeme@postgres:5432/sawa_db
      NODE_ENV: production
      SCORING_SERVICE_URL: http://scoring:8000
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      scoring:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    env_file: .env
    depends_on:
      - api

  scoring:
    build:
      context: ./packages/scoring
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SCORING_SERVICE_API_KEY: ${SCORING_SERVICE_API_KEY}

volumes:
  postgres_data:
