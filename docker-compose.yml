version: "3.9"

# All build contexts use the monorepo root so Dockerfiles can access
# all workspace packages.  This matches the Cloud Build setup exactly.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindlign_db
      POSTGRES_USER: mindlign
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindlign -d mindlign_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  scoring:
    build:
      context: .
      dockerfile: packages/scoring/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SCORING_SERVICE_API_KEY: ${SCORING_SERVICE_API_KEY:-dev-scoring-key}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://mindlign:changeme@postgres:5432/mindlign_db
      NODE_ENV: production
      SCORING_SERVICE_URL: http://scoring:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      scoring:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
